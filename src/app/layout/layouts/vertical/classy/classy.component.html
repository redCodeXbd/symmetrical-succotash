<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
    class="dark app-sidebar print:hidden"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="menu()"
    [opened]="!isScreenSmall"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <div class="flex w-full items-center p-4 pl-6">
            <!-- Logo -->
            <div
                class="flex min-w-0 items-center justify-center"
                [class]="theme.theme().logoBadge ? 'rounded-lg bg-white px-2 py-1' : ''"
            >
                <img
                    class="max-h-9 max-w-32 object-contain"
                    [src]="theme.logoUrl()"
                    [alt]="theme.theme().companyName"
                />
            </div>
        </div>
    </ng-container>
    <!-- Navigation footer hook: user card -->
    <ng-container fuseVerticalNavigationContentFooter>
        <a class="app-sidebar-user" routerLink="/profile" aria-label="Open your profile">
            <div class="relative flex-none">
                @if (user.avatar && access.user().id === 'u-brian') {
                    <img class="h-11 w-11 rounded-full object-cover" [src]="user.avatar" alt="" />
                } @else {
                    <div class="flex h-11 w-11 items-center justify-center rounded-full bg-primary text-base font-bold text-on-primary">
                        {{ access.user().name.charAt(0) }}
                    </div>
                }
                <span class="app-sidebar-user-dot" aria-hidden="true"></span>
            </div>
            <div class="min-w-0 flex-auto">
                <div class="truncate text-base font-semibold">{{ access.user().name }}</div>
                <div class="truncate text-xs opacity-70">{{ roleSummary }}</div>
            </div>
        </a>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex w-full min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div
        class="app-header relative z-49 flex h-16 w-full flex-0 items-center px-4 shadow md:px-6 print:hidden"
    >
        <!-- Navigation toggle button -->
        <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
            <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <!-- Components -->
        <div class="app-header-actions ml-auto flex items-center gap-1 pl-2 sm:gap-2">
            <search [appearance]="'bar'"></search>
            <notifications></notifications>
            <user [showAvatar]="true"></user>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>

    <!-- Footer -->
    <!--<div class="relative flex flex-0 items-center justify-start w-full h-14 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden">
        <span class="font-medium text-secondary">Fuse &copy; {{currentYear}}</span>
    </div>-->
</div>
