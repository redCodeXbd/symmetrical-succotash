<treasury-slide-over [heading]="project ? 'Edit project' : 'New project'" [subheading]="project?.id ?? ''" (closed)="cancelled.emit()">
    <form id="project-form" class="flex flex-col gap-5" (ngSubmit)="save()">
        <label class="block">
            <span class="text-sm font-medium">Client *</span>
            <select class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="client" [(ngModel)]="model.clientId">
                <option value="">Choose a client...</option>
                @for (c of clients.clients(); track c.id) { <option [value]="c.id">{{ c.name }}</option> }
            </select>
        </label>
        <label class="block">
            <span class="text-sm font-medium">Project name *</span>
            <input class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="name" [(ngModel)]="model.name" />
        </label>

        <fieldset>
            <legend class="text-sm font-medium">What does the project deliver? *</legend>
            <div class="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-3">
                @for (t of types; track t.id) {
                    <label class="flex cursor-pointer flex-col rounded-lg border p-3" [class]="model.type === t.id ? 'border-primary bg-primary/10' : ''">
                        <span class="flex items-center gap-2"><input type="radio" name="type" [value]="t.id" [(ngModel)]="model.type" /><span class="font-medium">{{ t.label }}</span></span>
                        <span class="text-secondary text-sm">{{ t.description }}</span>
                    </label>
                }
            </div>
        </fieldset>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <label class="block">
                <span class="text-sm font-medium">Project manager *</span>
                <select class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="manager" [(ngModel)]="model.manager">
                    <option value="">Assign a manager...</option>
                    @for (m of managers; track m) { <option [value]="m">{{ m }}</option> }
                </select>
            </label>
            <label class="block">
                <span class="text-sm font-medium">Company branch</span>
                <select class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="branch" [(ngModel)]="model.branch">
                    <option value="">No branch (vendor only)</option>
                    @for (b of branches; track b) { <option [value]="b">{{ b }}</option> }
                </select>
            </label>
        </div>

        <fieldset>
            <legend class="text-sm font-medium">Vendors on this project</legend>
            <div class="mt-2 flex flex-wrap gap-2">
                @for (v of vendors.vendors(); track v.id) {
                    <label class="flex cursor-pointer items-center gap-2 rounded-full border px-3 py-1 text-sm" [class]="model.vendorIds.includes(v.id) ? 'border-primary bg-primary/10' : ''">
                        <input type="checkbox" class="h-4 w-4" [checked]="model.vendorIds.includes(v.id)" (change)="toggleVendor(v.id, $event)" />{{ v.name }}
                    </label>
                } @empty {
                    <span class="text-secondary text-sm">No vendors yet.</span>
                }
            </div>
        </fieldset>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <label class="block">
                <span class="text-sm font-medium">Location</span>
                <input class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="location" [(ngModel)]="model.location" />
            </label>
            <label class="block">
                <span class="text-sm font-medium">Work order</span>
                <input class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" list="project-wo" name="wo" [(ngModel)]="model.workOrder" />
                <datalist id="project-wo">@for (w of funds.workOrders; track w) { <option [value]="w"></option> }</datalist>
                <span class="text-secondary mt-1 block text-xs">Expenses that name this work order count in the costing.</span>
            </label>
            <label class="block"><span class="text-sm font-medium">Start</span><input type="date" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="start" [(ngModel)]="model.startDate" /></label>
            <label class="block"><span class="text-sm font-medium">Due</span><input type="date" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="due" [(ngModel)]="model.dueDate" /></label>
        </div>
        <label class="block">
            <span class="text-sm font-medium">Description</span>
            <textarea class="mt-1 w-full rounded-lg border bg-transparent px-3 py-2 text-md" rows="2" name="desc" [(ngModel)]="model.description"></textarea>
        </label>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <label class="block"><span class="text-sm font-medium">Contract value (BDT)</span><input type="number" min="0" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="cv" [(ngModel)]="model.contractValue" /><span class="text-secondary mt-1 block text-xs">What the client pays.</span></label>
            <label class="block"><span class="text-sm font-medium">Project budget (BDT)</span><input type="number" min="0" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="bg" [(ngModel)]="model.budget" /><span class="text-secondary mt-1 block text-xs">What we plan to spend.</span></label>
        </div>

        <fieldset>
            <legend class="text-sm font-medium">Client payment</legend>
            <div class="mt-2 grid grid-cols-2 gap-2">
                <label class="flex cursor-pointer items-center gap-2 rounded-lg border p-3" [class]="model.paymentTerm === 'advance' ? 'border-primary bg-primary/10' : ''"><input type="radio" name="term" value="advance" [(ngModel)]="model.paymentTerm" />Advance</label>
                <label class="flex cursor-pointer items-center gap-2 rounded-lg border p-3" [class]="model.paymentTerm === 'credit' ? 'border-primary bg-primary/10' : ''"><input type="radio" name="term" value="credit" [(ngModel)]="model.paymentTerm" />Credit</label>
            </div>
            @if (model.paymentTerm === 'advance') {
                <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <label class="block"><span class="text-sm font-medium">Advance (%)</span><input type="number" min="0" max="100" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="ap" [(ngModel)]="model.advancePercent" /><span class="text-secondary mt-1 block text-xs">= BDT {{ advanceDue.toLocaleString('en-US') }}</span></label>
                    <label class="block"><span class="text-sm font-medium">Advance received (BDT)</span><input type="number" min="0" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md" name="ar" [(ngModel)]="model.advanceReceived" /></label>
                </div>
            } @else {
                <label class="mt-3 block"><span class="text-sm font-medium">Credit period (days after delivery)</span><input type="number" min="0" class="mt-1 h-11 w-full rounded-lg border bg-transparent px-3 text-md sm:w-1/2" name="cd" [(ngModel)]="model.creditDays" /></label>
            }
        </fieldset>

        @if (error) {
            <div class="rounded-lg bg-red-50 p-3 text-md text-red-800" role="alert">{{ error }}</div>
        }
    </form>
    <ng-container footer>
        <button mat-stroked-button type="button" (click)="cancelled.emit()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" form="project-form">Save project</button>
    </ng-container>
</treasury-slide-over>
