<!-- Desktop and tablet -->
<button type="button" class="add-btn" [attr.aria-keyshortcuts]="shortcut" (click)="pressed.emit()">
    <span class="add-btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
        </svg>
    </span>
    <span>{{ label }}</span>
    <kbd class="add-btn-kbd" aria-hidden="true">{{ shortcut }}</kbd>
</button>

<!-- Phones: floating button -->
<button type="button" class="add-fab" (click)="pressed.emit()">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
    </svg>
    <span>{{ label }}</span>
</button>
